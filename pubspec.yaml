name: monthly
description: "A private, offline-first period and cycle tracker with zero cloud costs."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.19.0
  table_calendar: ^3.1.2
  fl_chart: ^0.68.0
  pdf: ^3.10.8
  printing: ^5.13.1
  flutter_local_notifications: ^17.2.1
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/articles/
